name: Deploy Portfolio to AWS S3

on:
  push:
    branches:
      - master

permissions:
  id-token: write # Required for requesting the JWT token from GitHub OIDC
  contents: read  # Required for actions/checkout

jobs:
  deploy:
    name: Deploy to S3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ap-southeast-1 # Update to your AWS Region (e.g. us-east-1, ap-southeast-1)

      - name: Deploy to S3 Bucket
        run: |
          aws s3 sync . s3://amryyahya.my.id \
            --delete \
            --exclude '.git/*' \
            --exclude '.github/*'

      # Optional: Invalidate CloudFront CDN cache if you use CloudFront for HTTPS / custom domain
      # - name: Invalidate CloudFront Cache
      #   run: |
      #     aws cloudfront create-invalidation \
      #       --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
      #       --paths "/*"
